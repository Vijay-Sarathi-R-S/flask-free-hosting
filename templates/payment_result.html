<!DOCTYPE html>
<html>
<head>
    <title>Payment Status</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        .box { max-width: 400px; margin: auto; padding: 30px; border-radius: 10px; }
        .SUCCESS { background: #e8fff1; color: #0a7a3d; }
        .FAILED { background: #ffe8e8; color: #a00000; }
        .PENDING { background: #fff7e0; color: #a67c00; }
    </style>
</head>
<body>

<div class="box {{ payment.status }}">
    <h2>Payment {{ payment.status }}</h2>
    <p><b>Transaction ID:</b> {{ payment.transaction_id }}</p>
    <p><b>Item:</b> {{ order.item_name }}</p>
    <p><b>Amount:</b> ₹{{ payment.amount }}</p>
    <p><b>Status:</b> {{ payment.status }}</p>
</div>

<br>
<a href="{{ url_for('home') }}">Back to Home</a>

</body>
</html>
